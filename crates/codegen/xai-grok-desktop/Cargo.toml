[package]
name = "xai-grok-desktop"
version = "0.1.220-alpha.4"
edition.workspace = true
license = "Apache-2.0"
authors = ["xAI"]
default-run = "grok-desktop"

[[bin]]
name = "grok-desktop"
path = "src/main.rs"

[[bin]]
name = "grok-web"
path = "src/bin/grok-web.rs"
required-features = ["web-runtime"]

[features]
default = []
agent-runtime = ["dep:tokio", "dep:tokio-util", "dep:xai-acp-lib", "dep:xai-grok-shell", "dep:agent-client-protocol"]
tauri-runtime = ["agent-runtime", "dep:tauri", "dep:tauri-build"]
web-runtime = ["agent-runtime", "dep:axum", "dep:futures-util", "dep:rand", "dep:serde_json", "dep:tower-http"]

[dependencies]
anyhow = { workspace = true }
dunce = { workspace = true }
serde = { workspace = true, features = ["derive"] }
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync"], optional = true }
tokio-util = { workspace = true, optional = true }
xai-acp-lib = { workspace = true, optional = true }
xai-grok-shell = { workspace = true, optional = true }
agent-client-protocol = { workspace = true, optional = true }
tauri = { version = "2", features = [], optional = true }
tower-http = { workspace = true, features = ["fs"], optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
tower = { workspace = true }
